[Window]
# Initial window resolution (InitOnly - cannot be changed at runtime)
window.width = 1280
window.height = 720

[System]
# Output directory for the engine text logs (InitOnly)
sys.logdir = /saved/logs

# 0: Fatal, 1: Error, 2: Warning, 3: Info, 4: Debug, 5: Trace
e.logverbosity = 5

[Tools]
# Attach debugging tools at boot (InitOnly)
sys.attachrenderdoc = false
sys.attachtracy = true

# Absolute or relative paths to Tracy executables
tracy.viewerpath = Tracy.exe
tracy.capturepath = tracy-capture.exe

[Rendering]
# Resolution of shadow maps in pixels
r.shadowmapsize = 2048

# 0: None, 1: Base Color, 2: Raw Normal, 3: World Normal, 4: Metal, 5: Rough, 6: Depth
r.debugmode = 0

# Enable AABB-based frustum culling for draw items
r.frustumculling = true

# Freezes the rendering state on the frame (stops updating transforms)
r.freezerendering = false